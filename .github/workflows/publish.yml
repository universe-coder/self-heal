name: Publish to PyPI

# Publishes with PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on PyPI: project "self-heal-runtime" -> Publishing -> add a
# GitHub publisher with owner "universe-coder", repository "self-heal",
# workflow "publish.yml", environment "pypi".
#
# Release: push a tag "vX.Y.Z" matching [project].version in pyproject.toml,
# or run this workflow manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $ver" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/self-heal-runtime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # re-running for an already-published version is a no-op
          print-hash: true
