[llm]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
embedding_model = "text-embedding-3-small"
api_key_env = "OPENAI_API_KEY"
timeout_s = 60
max_tokens = 4096

[index]
roots = ["src/"]
exclude = [".git/", "node_modules/", "__pycache__/", "*.pyc", ".venv/", ".self-heal/", ".chroma/"]
chunk_max_lines = 80
chunk_overlap_lines = 10

[heal]
allowed_paths = ["src/**", "examples/**"]
forbidden_paths = [".env*", "**/secrets/**", ".git/", "pyproject.toml"]
auto_apply = false
max_attempts = 3
backup = true
top_k = 8
max_diff_lines = 500

[supervisor]
restart_on_exit_codes = [1]
max_restarts = 5
healthcheck_grace_s = 5

[notifications]
enabled = false
events = [
  "error_captured",
  "heal_diff_proposed",
  "heal_empty_diff",
  "heal_applied",
  "heal_apply_failed",
]
timeout_s = 5
include_diff = false
include_traceback = true
max_traceback_lines = 20

[notifications.telegram]
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id = ""
parse_mode = "HTML"

[notifications.slack]
enabled = false
webhook_url_env = "SLACK_WEBHOOK_URL"

[notifications.webhook]
enabled = false
url_env = "SELF_HEAL_WEBHOOK_URL"
signing_secret_env = "SELF_HEAL_WEBHOOK_SECRET"
allow_insecure = false

[notifications.sentry]
enabled = false
dsn_env = "SENTRY_DSN"
environment = ""
release = ""
