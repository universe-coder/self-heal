[llm]
provider = "openai"                 # openai | anthropic | huggingface | ollama
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
embedding_model = "text-embedding-3-small"
api_key_env = "OPENAI_API_KEY"      # the key is read from this environment variable
timeout_s = 60
max_tokens = 4096
max_retries = 3                     # retries on throttling / timeouts / 5xx
# temperature = 0                   # sent only when set (some reasoning models reject it)

# Embeddings may come from a different OpenAI-compatible endpoint than chat.
# Required for provider = "anthropic" (no embeddings API) if you want indexing.
# embedding_base_url = "http://localhost:11434/v1"
# embedding_api_key_env = "OLLAMA_API_KEY"

# --- Alternative providers (uncomment one) ---
# provider = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# model = "claude-sonnet-4-5"
# api_key_env = "ANTHROPIC_API_KEY"

# provider = "huggingface"
# base_url = "https://router.huggingface.co/v1"
# model = "meta-llama/Llama-3.1-8B-Instruct"
# embedding_model = "intfloat/multilingual-e5-large"
# api_key_env = "HF_TOKEN"

# provider = "ollama"
# base_url = "http://localhost:11434/v1"
# model = "llama3.1"
# embedding_model = "nomic-embed-text"
# api_key_env = "OLLAMA_API_KEY"  # ignored by Ollama; no auth required

[index]
roots = ["src/"]
exclude = [".git/", "node_modules/", "__pycache__/", "*.pyc", ".venv/", ".self-heal/", ".chroma/"]
respect_gitignore = true            # also skip whatever the project's .gitignore ignores
chunk_max_lines = 80
chunk_overlap_lines = 10

[heal]
allowed_paths = ["src/**", "examples/**"]
forbidden_paths = [".env*", "**/secrets/**", ".git/", "pyproject.toml"]
allowed_extensions = [".py"]        # file types a patch may touch
auto_apply = false                  # in-process "apply" mode writes patches only if true
max_attempts = 3                    # model round-trips; failures are fed back as feedback
backup = true                       # copy files to .self-heal/backups/<ts>/ before patching
top_k = 8                           # indexed chunks added to the prompt
context_lines = 40                  # source lines shown around each traceback frame
max_diff_lines = 500
cooldown_s = 300                    # in-process: same error is not healed again within this window

[supervisor]
restart_on_exit_codes = [1]
max_restarts = 5
healthcheck_grace_s = 5
stop_on_repeated_traceback = true   # stop when the same crash repeats and nothing was applied

[notifications]
enabled = false
events = [
  "error_captured",
  "heal_diff_proposed",
  "heal_empty_diff",
  "heal_applied",
  "heal_apply_failed",
  # "heal_rejected",                # patch rejected by the path policy on every attempt
  # "heal_rolled_back",             # `self-heal rollback`
]
timeout_s = 5
include_diff = false
include_traceback = true
max_traceback_lines = 20

[notifications.telegram]
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id = ""
parse_mode = "HTML"                 # HTML | MarkdownV2 | none

[notifications.slack]
enabled = false
webhook_url_env = "SLACK_WEBHOOK_URL"

[notifications.webhook]
enabled = false
url_env = "SELF_HEAL_WEBHOOK_URL"
signing_secret_env = "SELF_HEAL_WEBHOOK_SECRET"
allow_insecure = false

[notifications.sentry]
enabled = false
dsn_env = "SENTRY_DSN"
environment = ""
release = ""
